<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniShop | Iniciar sesión</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="auth-page">
  <section class="auth-box">
    <a class="logo" href="index.html">OmniShop<b>▮</b></a>
    <h1>Iniciar sesión</h1>
    <form class="auth-form" onsubmit="event.preventDefault(); alert('Este proyecto está configurado como sitio estático. La autenticación real se hace en backend separado.'); window.location.href='index.html';">
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" required autocomplete="email">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
      <button class="checkout" type="submit">Entrar</button>
    </form>
    <p class="auth-switch">¿No tienes cuenta? <a href="registro.html">Crear cuenta</a></p>
    <p class="auth-switch"><a href="index.html">Volver a la tienda</a></p>
  </section>
</main>
</body>
</html>
